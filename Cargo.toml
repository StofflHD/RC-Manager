[package]
name = "rc-manager"
version = "0.9.4"
edition = "2021"
description = "RC Manager – remote connection manager for RDP, SSH, VNC, web and external programs – Linux re-implementation of the Windows RDP-Manager"
authors = ["© StofflHD and Claude"]
license = "GPL-3.0-or-later"
repository = "https://github.com/StofflHD/RC-Manager"

[dependencies]
# Pinned: the egui API changes between releases (same versions as the IP Calculator).
eframe = { version = "=0.29.1", features = ["persistence"] }
egui = "=0.29.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
# SHA-256 of downloaded updates (the updater shared with notepad-rs)
sha2 = "0.10"
anyhow = "1.0.89"
dirs = "5.0.1"
shell-words = "1.1.0"
# Native file dialogs; on Linux via the XDG desktop portal (pure Rust, falls back to zenity).
rfd = "=0.15.1"
# Backups of the original are ZIP files (deflate only, pure Rust).
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Encryption of stored credentials
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
rand = "0.8.5"

# Import of the Windows database (AES-CBC + PasswordDeriveBytes/SHA-1, MD5 for the app password)
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
sha1 = "0.10.6"
md-5 = "0.10.6"
base64 = "0.22.1"

# Embedding of client windows into RC Manager's window (X11).
raw-window-handle = "0.6"

# VNC password file (fixed-key DES format of vncpasswd)
des = "0.8.1"

[build-dependencies]
# Windows: program icon and version information in rc-manager.exe (see build.rs).
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Direct3D renderer for machines without OpenGL 2.
eframe = { version = "=0.29.1", default-features = false, features = ["wgpu"] }
# eframe enables no Direct3D backend by itself (also D3D12's software adapter WARP).
wgpu = { version = "22.1", default-features = false, features = ["dx12"] }
# Embedding of client windows (Win32 child windows), console for command-line output.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["res", "shape"] }
# For EventLoopBuilderExtX11: RC Manager runs on X11/XWayland so that sessions can be embedded.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Quick local test builds (packaging/wsl-dev.sh): optimised, but without LTO and with
# incremental compilation, so a change rebuilds in seconds.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
