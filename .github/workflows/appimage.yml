name: AppImage

# Builds the AppImage (with FreeRDP, TigerVNC and sshpass bundled) on every push and
# publishes it as a release asset for tags like v0.3.0.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FREERDP_VERSION: 3.32.2
  FREERDP_PREFIX: /opt/freerdp

jobs:
  appimage:
    # The bundled clients come from this release: the AppImage needs glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies and clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl \
            libssl-dev zlib1g-dev libcjson-dev libusb-1.0-0-dev \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxdamage-dev libxv-dev \
            libxkbfile-dev libxi-dev libxrandr-dev libxrender-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev libpulse-dev libcups2-dev libpcsclite-dev libopenh264-dev \
            tigervnc-viewer sshpass xterm \
            xvfb freerdp2-shadow-x11 x11vnc x11-apps x11-xserver-utils imagemagick xdotool x11-utils libgl1-mesa-dri libegl1

      - name: Cache FreeRDP
        id: freerdp-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FREERDP_PREFIX }}
          key: freerdp-${{ env.FREERDP_VERSION }}-ubuntu-22.04-h264-v4

      - name: Build FreeRDP ${{ env.FREERDP_VERSION }}
        if: steps.freerdp-cache.outputs.cache-hit != 'true'
        # Outside the checkout: FreeRDP takes its version from `git describe` when it finds
        # a git repository, which would pick up RC Manager's tags.
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o freerdp.tar.gz \
            "https://github.com/FreeRDP/FreeRDP/archive/refs/tags/${FREERDP_VERSION}.tar.gz"
          tar xzf freerdp.tar.gz
          cmake -S "FreeRDP-${FREERDP_VERSION}" -B freerdp-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$FREERDP_PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DWITH_X11=ON -DWITH_WAYLAND=OFF \
            -DWITH_CLIENT_SDL=OFF -DWITH_CLIENT_SDL2=OFF -DWITH_CLIENT_SDL3=OFF \
            -DWITH_SERVER=OFF -DWITH_SHADOW=OFF -DWITH_PROXY=OFF -DWITH_SAMPLE=OFF -DWITH_PLATFORM_SERVER=OFF \
            -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_DSP_FFMPEG=OFF -DWITH_VIDEO_FFMPEG=OFF \
            -DWITH_OPENH264=ON -DWITH_OPENH264_LOADING=OFF \
            -DWITH_FUSE=OFF -DWITH_WEBVIEW=OFF -DWITH_KRB5=OFF -DWITH_PKCS11=OFF -DWITH_CAIRO=OFF \
            -DWITH_URIPARSER=OFF -DUSE_UNWIND=OFF -DWITH_UNICODE_BUILTIN=ON \
            -DWITH_PULSE=ON -DWITH_ALSA=ON -DWITH_CUPS=ON -DWITH_PCSC=ON \
            -DCHANNEL_URBDRC=OFF -DWITH_MANPAGES=OFF -DBUILD_TESTING=OFF -DWITH_VERBOSE_WINPR_ASSERT=OFF
          cmake --build freerdp-build
          sudo cmake --install freerdp-build
          sudo install -Dm644 "FreeRDP-${FREERDP_VERSION}/LICENSE" "$FREERDP_PREFIX/share/doc/freerdp-LICENSE"
          "$FREERDP_PREFIX/bin/"xfreerdp* --version | tee version.txt
          grep -q "version ${FREERDP_VERSION}" version.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install zig and cargo-zigbuild (RC Manager itself targets glibc 2.31)
        run: pip install ziglang==0.16.0 cargo-zigbuild==0.23.4

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build AppImage
        run: ZIGBUILD=1 GLIBC=2.31 BUNDLE_TOOLS=1 bash packaging/build-appimage.sh

      - name: Smoke test
        run: |
          APP=$(ls dist/RC-Manager-*-x86_64.AppImage)
          ls -la "$APP"
          # Run from an extracted copy without the build machine's /opt/freerdp.
          sudo mv "$FREERDP_PREFIX" "$FREERDP_PREFIX.hidden"
          "$APP" --appimage-extract > /dev/null
          ldd squashfs-root/usr/bin/* > ldd.txt 2>&1 || true
          if grep "not found" ldd.txt; then echo "unresolved libraries in the AppImage" >&2; exit 1; fi
          # H.264 (/gfx:AVC444) needs OpenH264 linked into FreeRDP and bundled along.
          ls -la squashfs-root/usr/lib/libopenh264.so* || { echo "libopenh264 not bundled – H.264 would be unavailable" >&2; exit 1; }
          ldd squashfs-root/usr/lib/libfreerdp*.so* 2>/dev/null | grep -q libopenh264 || { echo "FreeRDP is not linked against OpenH264" >&2; exit 1; }
          squashfs-root/usr/bin/xfreerdp* --version > rdp.txt 2>&1 || true
          cat rdp.txt
          grep -q "version ${FREERDP_VERSION}" rdp.txt
          squashfs-root/usr/bin/sshpass -V > sshpass.txt 2>&1 || true
          head -1 sshpass.txt
          squashfs-root/AppRun --tools | tee tools.txt
          test "$(grep -c 'bundled with the AppImage' tools.txt)" = 4
          export APPIMAGE_EXTRACT_AND_RUN=1
          DATA=$(mktemp -d)
          "$APP" --data-dir "$DATA" --import tests/fixtures/legacy.db3
          "$APP" --data-dir "$DATA" --list | tee list.txt
          grep -q "DC01" list.txt
          sudo mv "$FREERDP_PREFIX.hidden" "$FREERDP_PREFIX"
          # The extracted copy stays for the GUI test.

      # Sessions embedded as tabs: two virtual X servers – :98 is shared via RDP by FreeRDP's
      # shadow server (a clock and a terminal on it), RC Manager runs on :99 – and screenshots
      # of the certificate dialog, the RDP tab before/after resizing and an SSH tab.
      - name: GUI test (Xvfb, RDP shadow server)
        env:
          RC_MANAGER_NO_UPDATE: "1"
        run: |
          # The AppImage must not depend on the runner's xkbcommon-x11 (bundled instead).
          sudo dpkg -r --force-depends libxkbcommon-x11-0
          python3 - <<'EOF'
          import shutil, sqlite3
          shutil.copy('tests/fixtures/legacy.db3', 'gui-test.db3')
          db = sqlite3.connect('gui-test.db3')
          db.execute("UPDATE Connections SET Target='127.0.0.1:3390' WHERE Name = 'DC01'")
          db.execute("UPDATE Connections SET Target='127.0.0.1' WHERE Name = 'Linux-Box'")
          db.execute("DELETE FROM FolderSetting")
          # A VNC connection (original's VNC type) to x11vnc on display :98.
          db.execute("""INSERT INTO Connections (Id, Name, Target, Sorting, Icon, Color, Parent, Setting, Credential, Type, Deleted)
                        VALUES ('eeeeeeee-0000-0000-0000-000000000009', 'VNC-Test', '127.0.0.1', 0,
                                'CB253433-7C84-48E4-8675-599024761E68', 0, '11111111-1111-1111-1111-111111111111',
                                'e338af54-19fb-4875-b752-8b6f035764d6', 'cccccccc-0000-0000-0000-000000000002',
                                'BEC8FD2B-680F-446D-9CF9-DED005C41F8E', 0)""")
          db.commit()
          EOF
          mkdir -p gui
          Xvfb :98 -screen 0 1280x800x24 &
          Xvfb :99 -screen 0 1920x1200x24 &
          sleep 2
          DISPLAY=:98 xsetroot -solid steelblue
          DISPLAY=:98 xclock -geometry 300x300+60+60 -update 1 &
          DISPLAY=:98 xterm -geometry 70x20+420+60 -bg navy -fg white -e sh -c 'echo "Remote desktop via RDP"; while true; do date; sleep 1; done' &
          DISPLAY=:98 freerdp-shadow-cli /port:3390 -auth > gui/shadow.log 2>&1 &
          SHADOW=$!
          x11vnc -display :98 -rfbport 5900 -nopw -forever -shared -quiet > gui/x11vnc.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          DATA=$(mktemp -d)
          squashfs-root/AppRun --data-dir "$DATA" --import gui-test.db3
          # Unknown self-signed certificate: RC Manager has to ask (screenshot 0); the test
          # clicks "Trust always" in the dialog (centre of the 1150x780 window).
          squashfs-root/AppRun --data-dir "$DATA" --connect DC01 > gui/app-rdp.log 2>&1 &
          APP=$!
          sleep 10
          import -window root gui/0-certificate-dialog.png
          xdotool mousemove 421 511 click 1
          sleep 15
          import -window root gui/1-rdp-tab.png
          xwininfo -root -tree > gui/1-windows.txt
          WID=$(xdotool search --name '^RC Manager$' | head -1)
          test -n "$WID" || { cat gui/app-rdp.log; exit 1; }
          xdotool windowsize "$WID" 1700 1100
          sleep 10
          import -window root gui/2-rdp-resized.png
          xwininfo -root -tree > gui/2-windows.txt
          kill $APP || true
          sleep 3
          # Second connection: the remembered fingerprint must be accepted without a dialog;
          # the connection is switched to "scale into the tab" (smart sizing) before.
          python3 - "$DATA/rc-manager.db3" <<'EOF'
          import json, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          (opts,) = db.execute("SELECT options FROM connections WHERE name = 'DC01'").fetchone()
          o = json.loads(opts)
          o["rdp"]["dynamic_resolution"] = False
          o["rdp"]["resolution"] = ""
          db.execute("UPDATE connections SET options = ? WHERE name = 'DC01'", (json.dumps(o),))
          db.commit()
          EOF
          squashfs-root/AppRun --data-dir "$DATA" --connect DC01 > gui/app-rdp2.log 2>&1 &
          APP=$!
          sleep 15
          import -window root gui/4-rdp-reconnect-scaled.png
          kill $APP || true
          sleep 3
          squashfs-root/AppRun --data-dir "$DATA" --connect VNC-Test > gui/app-vnc.log 2>&1 &
          APP=$!
          sleep 15
          import -window root gui/5-vnc-tab.png
          xwininfo -root -tree > gui/5-windows.txt
          kill $APP || true
          sleep 3
          # A restarted shadow server has a new certificate: RC Manager must warn that it
          # differs from the trusted one (screenshot 6).
          kill $SHADOW || true
          sleep 2
          rm -rf "$HOME/.config/freerdp"   # the shadow server keeps its certificate there
          DISPLAY=:98 freerdp-shadow-cli /port:3390 -auth > gui/shadow2.log 2>&1 &
          sleep 4
          squashfs-root/AppRun --data-dir "$DATA" --connect DC01 > gui/app-rdp3.log 2>&1 &
          APP=$!
          sleep 10
          import -window root gui/6-changed-certificate.png
          kill $APP || true
          sleep 2
          squashfs-root/AppRun --data-dir "$DATA" --connect Linux-Box > gui/app-ssh.log 2>&1 &
          APP=$!
          sleep 10
          import -window root gui/3-ssh-tab.png
          xwininfo -root -tree > gui/3-windows.txt
          kill $APP || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test
          path: gui/

      - uses: actions/upload-artifact@v4
        with:
          name: RC-Manager-AppImage
          path: dist/RC-Manager-*-x86_64.AppImage

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The updater only installs an AppImage whose SHA-256 matches this file.
          (cd dist && sha256sum "RC-Manager-$VERSION-x86_64.AppImage" > "RC-Manager-$VERSION-x86_64.AppImage.sha256")
          gh release create "$GITHUB_REF_NAME" dist/RC-Manager-*-x86_64.AppImage dist/RC-Manager-*-x86_64.AppImage.sha256 \
            --title "RC Manager $VERSION" \
            --prerelease \
            --notes "RC Manager $VERSION for Linux (x86_64, glibc ≥ 2.35, e.g. Ubuntu 22.04, Debian 12, Fedora 36 or newer).

          Includes FreeRDP ${FREERDP_VERSION}, TigerVNC viewer and sshpass – nothing else needs to be installed except a terminal for SSH/Telnet.

          \`\`\`bash
          chmod +x RC-Manager-$VERSION-x86_64.AppImage
          ./RC-Manager-$VERSION-x86_64.AppImage
          \`\`\`

          Imports backups (.zip) and databases (SqLiteDatabase.db3) of the Windows RDP-Manager. See the README for details."
